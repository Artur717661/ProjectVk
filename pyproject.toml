[project]
name = "photo-service"
version = "0.1.0"
description = "Photo analysis backend (Mail Cloud training case)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "aiokafka>=0.11.0",
    "grpcio>=1.66.0",
    "grpcio-tools>=1.66.0",
    "miniopy-async>=1.20",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "Pillow>=10.4.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
